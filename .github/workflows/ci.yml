name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装核心
        run: pip install .
      - name: 安装 wechat + dev extras
        run: pip install ".[wechat,dev]"
      - name: 单元测试 + 召回基线测试
        run: pytest
      - name: 独立基线回归（不经 pytest，走安装后 CLI + fixtures 迷你库）
        run: |
          python scripts/check_recall_baseline.py \
            --repo tests/fixtures/kb \
            --build \
            --out-dir "$RUNNER_TEMP/recall-eval" \
            --tag ci-baseline \
            --demo
      - name: 构建校验
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

  # 自检（dogfood）：本仓库自己的文档要过自己定的门禁。
  # 收录范围见根 llmwiki.toml —— 只收面向使用者的 docs/ 与测试夹具，
  # knowledge-base/ project-records/ deliverables/ 三层不进索引。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装核心
        run: pip install .
      - name: lint 自检（默认 + 严格链接口径）
        run: |
          llmwiki lint
          llmwiki lint --strict-links

  # 版本自洽：pyproject.toml 是唯一真源，其余落点必须跟它一致。
  # 历史缺位：0.1.3 有 CHANGELOG 无 tag、0.1.2 有 tag 无 CHANGELOG 正文，都属同类漂移。
  # 只跑 stdlib 脚本，无需安装包。
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 版本号一致性（含硬编码回潮检查）
        run: python scripts/version.py --check
