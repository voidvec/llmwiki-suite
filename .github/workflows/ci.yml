name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装核心
        run: pip install .
      - name: 安装 wechat + dev extras
        run: pip install ".[wechat,dev]"
      - name: 单元测试 + 召回基线测试
        run: pytest
      - name: 构建校验
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*