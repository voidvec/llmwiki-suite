name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装核心
        run: pip install .
      - name: 安装 wechat + dev extras
        run: pip install ".[wechat,dev]"
      - name: 单元测试 + 召回基线测试
        run: pytest
      - name: 独立基线回归（不经 pytest，走安装后 CLI + fixtures 迷你库）
        run: |
          python scripts/check_recall_baseline.py \
            --repo tests/fixtures/kb \
            --build \
            --out-dir "$RUNNER_TEMP/recall-eval" \
            --tag ci-baseline \
            --demo
      - name: 构建校验
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*
