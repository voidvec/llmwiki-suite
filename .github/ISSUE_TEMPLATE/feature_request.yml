name: ✨ 功能建议
description: 提出新功能、通道或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好的功能建议包含：**要解决的痛点 + 使用场景 + 你期望的行为**。
        检索类增强建议附上 `llmwiki eval` 的现状数字，便于量化收益。
  - type: dropdown
    id: category
    attributes:
      label: 类别
      multiple: true
      options:
        - 新命令 / CLI
        - 检索质量（BM25 / 打分 / 索引）
        - 新渠道（服务桥接 / 协议）
        - 可视化（图谱 / 报告）
        - 文档 / 国际化
        - 工程化（CI / 打包 / 自动化）
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 痛点 / 场景
      description: "在什么情况下你需要这个能力？现在怎么做（或做不到）？"
      placeholder: "例如：知识库 2000 篇后，纯 BM25 对同义改写召回下降，评估集 recall@4=0.62…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为 / 接口形态。越具体越好
      placeholder: "新增 `llmwiki embed` 命令，支持 bge-small-zh 稠密索引，RRF 融合…"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 还考虑过哪些替代？为什么它们不够好？
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（已知）
      options:
        - label: 核心包（src/llmwiki）——零第三方依赖
        - label: wechat extras（fastapi/uvicorn）
        - label: 文档 / 脚手架